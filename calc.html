<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika Rendi Hestu</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .kalkulator {
            max-width: 430px;
            margin: 80px auto;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .judul {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px 15px;
            font-size: 21px;
            font-weight: bold;
        }

        .identitas {
            font-size: 12px;
            font-weight: normal;
            margin-top: 5px;
        }

        .isi-kalkulator {
            padding: 30px;
            background-color: white;
        }

        .form-label {
            color: black;
            font-weight: 500;
        }

        .form-control,
        .form-select {
            background-color: white;
            color: black;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 7px;
        }

        .btn-hitung {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            padding: 11px;
            border-radius: 7px;
            border: none;
        }

        .btn-hitung:hover {
            background-color: #0b5ed7;
            color: white;
        }

        #hasil {
            background-color: black;
            color: white;
            font-size: 35px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            min-height: 100px;
        }

        #hasil h5 {
            color: white;
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="kalkulator">

            <div class="judul">
                Kalkulator Aritmatika
                <div class="identitas">
                    Rendi Hestu - NIM. 262302010
                </div>
            </div>

            <div class="isi-kalkulator">

                <div class="mb-3">
                    <label class="form-label">Angka Pertama</label>
                    <input type="number" id="angka1"
                        class="form-control"
                        placeholder="Masukkan angka pertama">
                </div>

                <div class="mb-3">
                    <label class="form-label">Angka Kedua</label>
                    <input type="number" id="angka2"
                        class="form-control"
                        placeholder="Masukkan angka kedua">
                </div>

                <div class="mb-3">
                    <label class="form-label">Pilih Operator</label>
                    <select id="operator" class="form-select">
                        <option value="+">Penjumlahan (+)</option>
                        <option value="-">Pengurangan (-)</option>
                        <option value="*">Perkalian (*)</option>
                        <option value="/">Pembagian (/)</option>
                        <option value="%">Modulus (%)</option>
                        <option value="**">Pangkat (**)</option>
                    </select>
                </div>

                <button onclick="hitung()" class="btn btn-hitung w-100">
                    Hitung
                </button>

                <div id="hasil" class="mt-4">
                    <h5>Hasil Perhitungan:</h5>
                    <div id="angkaHasil">0</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function hitung() {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let operator = document.getElementById("operator").value;

            let hasil;

            if (angka1 === "" || angka2 === "") {
                document.getElementById("angkaHasil").innerHTML =
                    "Masukkan kedua angka!";
                return;
            }

            angka1 = Number(angka1);
            angka2 = Number(angka2);

            switch (operator) {
                case "+":
                    hasil = angka1 + angka2;
                    break;

                case "-":
                    hasil = angka1 - angka2;
                    break;

                case "*":
                    hasil = angka1 * angka2;
                    break;

                case "/":
                    hasil = angka2 === 0
                        ? "Tidak bisa dibagi 0"
                        : angka1 / angka2;
                    break;

                case "%":
                    hasil = angka2 === 0
                        ? "Tidak bisa modulus 0"
                        : angka1 % angka2;
                    break;

                case "**":
                    hasil = angka1 ** angka2;
                    break;
            }

            document.getElementById("angkaHasil").innerHTML = hasil;
        }
    </script>

</body>
</html>
